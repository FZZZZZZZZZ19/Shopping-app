name: Publish Shopping APP APK

on:
  push:
    branches: [main]
    paths:
      - 'release-assets/**'
      - '.github/workflows/publish-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release files
        uses: actions/checkout@v4
      - name: Verify APK checksum
        working-directory: release-assets
        run: sha256sum --check SHA256SUMS.txt
      - name: Publish APK and checksum as Release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.1.0 \
            release-assets/shopping-app-1.1.0.apk \
            release-assets/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title 'Shopping APP v1.1.0' \
            --notes-file release-assets/RELEASE-NOTES.md
