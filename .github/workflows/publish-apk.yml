name: Publish signed Shopping APP APK

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, for example v1.11.0'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;34.0.0 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run test:collector
      - name: Decode signing keystore
        env:
          SHOPPING_KEYSTORE_BASE64: ${{ secrets.SHOPPING_KEYSTORE_BASE64 }}
        run: |
          test -n "$SHOPPING_KEYSTORE_BASE64"
          printf '%s' "$SHOPPING_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
      - name: Build, test and sign
        env:
          SHOPPING_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          SHOPPING_KEYSTORE_PASSWORD: ${{ secrets.SHOPPING_KEYSTORE_PASSWORD }}
          SHOPPING_KEY_ALIAS: ${{ secrets.SHOPPING_KEY_ALIAS }}
          SHOPPING_KEY_PASSWORD: ${{ secrets.SHOPPING_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest lintDebug assembleRelease
          VERSION="$(grep -oP "versionName '\K[^']+" app/build.gradle)"
          cp app/build/outputs/apk/release/app-release.apk "shopping-app-${VERSION}.apk"
          sha256sum "shopping-app-${VERSION}.apk" > SHA256SUMS.txt
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
      - name: Verify signature
        run: |
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner | sort | tail -1)"
          "$APKSIGNER" verify --print-certs shopping-app-*.apk
          "$APKSIGNER" verify --print-certs shopping-app-*.apk | grep -q 'CN=Shopping APP'
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
        run: |
          NOTES="docs/RELEASE-NOTES-${VERSION}.md"
          if gh release view "$TAG" >/dev/null 2>&1; then
            [ -f "$NOTES" ] && gh release edit "$TAG" --notes-file "$NOTES"
          elif [ -f "$NOTES" ]; then
            gh release create "$TAG" --target "$GITHUB_SHA" --title "Shopping APP $TAG" --notes-file "$NOTES"
          else
            gh release create "$TAG" --target "$GITHUB_SHA" --title "Shopping APP $TAG" --generate-notes
          fi
          gh release upload "$TAG" "shopping-app-${VERSION}.apk" SHA256SUMS.txt --clobber
