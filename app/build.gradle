plugins { id 'com.android.application' }

def signingProps = new Properties()
def signingPropsFile = rootProject.file('keystore.properties')
if (signingPropsFile.exists()) {
    signingPropsFile.withInputStream { signingProps.load(it) }
}
def envOrProp = { String envName, String propName ->
    System.getenv(envName) ?: signingProps.getProperty(propName)
}
def releaseStorePath = envOrProp('SHOPPING_KEYSTORE_PATH', 'storeFile')
def hasReleaseSigning = releaseStorePath != null && !releaseStorePath.trim().isEmpty()

android {
    namespace 'com.shopping.app'
    compileSdk 35
    defaultConfig {
        applicationId 'com.shopping.app'
        minSdk 26
        targetSdk 35
        versionCode 3
        versionName '1.11.0'
        testInstrumentationRunner 'com.shopping.app.SmokeInstrumentation'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    buildFeatures { buildConfig true }
    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile rootProject.file(releaseStorePath)
                storePassword envOrProp('SHOPPING_KEYSTORE_PASSWORD', 'storePassword')
                keyAlias envOrProp('SHOPPING_KEY_ALIAS', 'keyAlias')
                keyPassword envOrProp('SHOPPING_KEY_PASSWORD', 'keyPassword')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (hasReleaseSigning) signingConfig signingConfigs.release
        }
    }
}
dependencies { testImplementation 'junit:junit:4.13.2'; testImplementation 'org.json:json:20240303' }
